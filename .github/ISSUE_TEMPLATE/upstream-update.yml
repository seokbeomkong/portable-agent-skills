name: Upstream Skill update
description: Report an upstream change that should be reviewed for a registered port
title: "[upstream] <skill-id> requires review"
labels: ["upstream-update"]
body:
  - type: input
    id: skill
    attributes:
      label: Skill ID
      placeholder: ui-ux-pro-max
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: Upstream release or commit
      placeholder: v2.15.0 or a full commit SHA
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: Relevant changes
      description: Summarize instructions, scripts, assets, license, or compatibility changes that may affect the port.
    validations:
      required: true
