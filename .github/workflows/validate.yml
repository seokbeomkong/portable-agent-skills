name: Validate registry

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate registry
        run: python scripts/validate_registry.py

      - name: Check generated catalog
        run: python scripts/generate_catalog.py --check

      - name: Run registered Skill checks
        run: python scripts/run_skill_checks.py

      - name: Build deterministic Skill packages
        run: python scripts/package_skills.py --check

      - name: Upload Skill packages
        uses: actions/upload-artifact@v4
        with:
          name: portable-agent-skills
          path: dist/*/skill.zip
          if-no-files-found: error
          retention-days: 14
